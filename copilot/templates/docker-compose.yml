# Egress migrated stack: AWS-managed services -> open-source, runs anywhere.
#   S3 -> SeaweedFS (S3 API) | RDS -> PostgreSQL | SQS -> RabbitMQ
#   Lambda -> container worker | CloudWatch awslogs -> local json-file logs
# Demo credentials only (override via env / .env). Not for production.
name: egress-migrated

x-app-env: &app-env
  S3_ENDPOINT_URL: http://s3:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY: egress
  S3_SECRET_KEY: ${S3_SECRET_KEY:-egress-demo-secret}
  S3_BUCKET: egress-demo-uploads
  AMQP_URL: amqp://egress:${RABBITMQ_PASSWORD:-egress-demo}@rabbitmq:5672/%2F
  QUEUE_NAME: egress-demo-jobs
  DB_HOST: postgres
  DB_NAME: uploads
  DB_USER: app
  DB_PASSWORD: ${DB_PASSWORD:-egress-demo}

services:
  postgres:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_DB: uploads
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-egress-demo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d uploads"]
      interval: 3s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e
    command: >
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=64 -master.volumePreallocate=false -volume.max=50
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:9000:8333"   # S3 API
      - "127.0.0.1:9001:8888"   # filer web UI (browse buckets)
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: egress
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-egress-demo}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./app
    environment: *app-env
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: ./app
    command: ["python", "worker.py"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      api: {condition: service_started}
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
